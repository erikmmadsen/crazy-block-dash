# CI: roda em toda Pull Request para a main.
# A PR só pode ser aprovada e juntada se estes dois jobs passarem.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (build e verificações)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Montar o jogo (www/ e site/)
        run: npm run site

      - name: Verificar jogo (versão, JavaScript, sons, imagens, idiomas, CHANGELOG)
        run: npm run check

      - name: Verificar se a versão subiu
        if: github.event_name == 'pull_request'
        run: node scripts/check-version.js "origin/${{ github.base_ref }}"

      - name: Prévia do site
        uses: actions/upload-artifact@v7
        with:
          name: site-previa
          path: site/
          retention-days: 7

  android:
    name: Android (APK de teste)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Montar o jogo e sincronizar com o Android
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Compilar APK de teste
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar APK de teste
        uses: actions/upload-artifact@v7
        with:
          name: crazy-block-dash-apk-teste
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
