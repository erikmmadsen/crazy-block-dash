# CD do site: roda quando uma PR aprovada é juntada na main e publica o jogo no GitHub Pages.
# (A Release de cada versão é feita pelo release.yml.)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  site:
    name: Publicar site (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Montar e verificar o site
        run: |
          npm ci
          npm run site
          npm run check

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
