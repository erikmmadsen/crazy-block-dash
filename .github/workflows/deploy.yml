# CD: roda quando uma PR aprovada é juntada na main.
#  1. publica o site no GitHub Pages
#  2. cria a Release vX.Y.Z (versão do package.json) com o APK e as notas do CHANGELOG
#     Se os segredos da chave da Play Store estiverem configurados, também anexa o .aab assinado.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  site:
    name: Publicar site (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Montar e verificar o site
        run: |
          npm ci
          npm run site
          npm run check

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    name: Release da versão
    runs-on: ubuntu-latest
    needs: site
    env:
      TEM_CHAVE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ler versão
        id: versao
        run: |
          V=$(node -p "require('./package.json').version")
          echo "v=$V" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$V" >/dev/null 2>&1; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
            echo "A tag v$V já existe: nada para lançar."
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.versao.outputs.existe == 'false'
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        if: steps.versao.outputs.existe == 'false'
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        if: steps.versao.outputs.existe == 'false'

      - name: Montar o jogo e sincronizar com o Android
        if: steps.versao.outputs.existe == 'false'
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Compilar APK
        if: steps.versao.outputs.existe == 'false'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "../crazy-block-dash-v${{ steps.versao.outputs.v }}.apk"

      - name: Compilar .aab assinado (Play Store)
        if: steps.versao.outputs.existe == 'false' && env.TEM_CHAVE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p assinatura
          echo "$KEYSTORE_BASE64" | base64 -d > assinatura/upload-key.jks
          {
            echo "storeFile=../../assinatura/upload-key.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > assinatura/keystore.properties
          (cd android && ./gradlew bundleRelease --no-daemon)
          cp android/app/build/outputs/bundle/release/app-release.aab "crazy-block-dash-v${{ steps.versao.outputs.v }}.aab"
          rm -rf assinatura

      - name: Notas da versão (do CHANGELOG)
        if: steps.versao.outputs.existe == 'false'
        run: |
          V="${{ steps.versao.outputs.v }}"
          awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notas.md
          printf '\n---\n🎮 Jogar no navegador: https://%s.github.io/%s/\n' "${{ github.repository_owner }}" "${{ github.event.repository.name }}" >> notas.md
          cat notas.md

      - name: Criar Release
        if: steps.versao.outputs.existe == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.versao.outputs.v }}"
          gh release create "v$V" crazy-block-dash-v$V.* \
            --target "${{ github.sha }}" \
            --title "Crazy Block Dash v$V" \
            --notes-file notas.md
