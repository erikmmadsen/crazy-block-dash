<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101329">
<title>Crazy Block Dash</title>
<meta name="description" content="Crazy Block Dash: encaixe blocos, limpe linhas e faça combos com peças especiais malucas. Jogue grátis no navegador!">
<link rel="icon" type="image/png" href="images/icone.png">
<link rel="apple-touch-icon" href="images/icone.png">
<style>
:root{--tex:radial-gradient(ellipse at 28% 22%,#ffffff8c 0 8%,#fff0 24%),repeating-linear-gradient(135deg,#ffffff12 0 2px,#fff0 2px 6px),linear-gradient(160deg,#ffffff38,#fff0 45%,#0000 58%,#00000040);--bevel:inset 3px 3px 0 -1px #ffffff45,inset -3px -3px 0 -1px #0000004d;--bg:#101329;--panel:#1c2142;--cell:#292f58;--line:#414a7d;--text:#f5f6ff;--accent:#73e0ff;--gap:4px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none}
body{margin:0;background:radial-gradient(circle at top,#283064,#101329 60%) fixed,#101329;color:var(--text);font-family:system-ui,Arial;min-height:100dvh;display:flex;justify-content:center;user-select:none;-webkit-user-select:none;
 padding:max(env(safe-area-inset-top),var(--safe-area-inset-top,0px)) max(env(safe-area-inset-right),var(--safe-area-inset-right,0px)) max(env(safe-area-inset-bottom),var(--safe-area-inset-bottom,0px)) max(env(safe-area-inset-left),var(--safe-area-inset-left,0px))}
main{width:min(96vw,560px);padding:18px 12px 30px;text-align:center}
.top{display:flex;justify-content:space-between;gap:8px;margin:4px 0 12px}
.icon{flex:0 0 56px;font-size:22px;padding:0;background:var(--panel);border:1px solid #394477;border-radius:14px;color:var(--text)}
.stat{position:relative;flex:1;font-weight:700;background:var(--panel);border:1px solid #394477;border-radius:14px;padding:10px}
.stat span{display:block;color:#8ef0ff;font-size:23px}
#board{position:relative;overflow:hidden;display:grid;grid-template-columns:repeat(10,1fr);gap:var(--gap);background:#171b38;padding:7px;border:1px solid #46518b;border-radius:14px;touch-action:none}
.cell{position:relative;aspect-ratio:1;background:var(--cell);border-radius:5px;min-width:0}
/* o bloco fica no ::after, assim a animação mexe só no bloco e a casa vazia continua no lugar */
.cell.filled::after{content:"";position:absolute;inset:0;border-radius:5px;background:var(--tex),var(--c,#57c9ff);box-shadow:var(--bevel),0 0 7px color-mix(in srgb,var(--c) 45%,transparent)}
.cell.sand::after{background:radial-gradient(circle at 30% 30%,#fff3 0 1.5px,transparent 2px) 0 0/6px 6px,linear-gradient(135deg,#f8d879,#b77b37)}
.cell.preview-valid{outline:2px solid #64f59b;background:#64f59b88}
/* linha/coluna que vai ser completada se soltar a peça aqui */
.line-hl{position:absolute;z-index:3;pointer-events:none;border:3px solid #ffe066;border-radius:8px;box-shadow:0 0 12px #ffd23f,inset 0 0 10px #ffd23f88;animation:linepulse .8s ease-in-out infinite alternate}
#multBadge{position:absolute;top:-9px;right:-6px;background:linear-gradient(#ffe066,#ffb400);color:#4a2a00;font-size:15px;font-weight:900;padding:3px 9px;border-radius:12px;box-shadow:0 0 10px #ffb400,0 2px 0 #b36b00}
#multBadge.pop{animation:multPop .45s cubic-bezier(.3,1.8,.5,1)}
/* comemoração do combo triplo: os dois personagens entram pelos lados e pulam, com o X no meio */
#party{position:fixed;inset:0;z-index:45;pointer-events:none;display:none;align-items:center;justify-content:center;gap:4vw}
#party.on{display:flex}
#party .pal{width:min(30vw,150px);aspect-ratio:1;border-radius:22px;background:center/cover no-repeat;border:3px solid var(--pc);box-shadow:0 0 18px var(--pc),0 8px 24px #000a}
#party .pal.l{--pc:#64f59b;animation:palInL .45s cubic-bezier(.3,1.5,.5,1) both,cheer .42s ease-in-out .45s 4 alternate}
#party .pal.r{--pc:#ff79bd;animation:palInR .45s cubic-bezier(.3,1.5,.5,1) both,cheer .42s ease-in-out .55s 4 alternate}
#party .mult{font:900 clamp(56px,17vw,96px)/1 system-ui,Arial;color:#ffe066;text-shadow:0 0 18px #ffb400,0 4px 0 #b36b00,0 0 40px #ff8a2b;animation:multPop .5s cubic-bezier(.3,1.8,.5,1) .2s both}
#party.out{animation:partyOut .35s ease-in forwards}
#party .conf{position:absolute;width:10px;height:10px;border-radius:2px;background:var(--cc);left:50%;top:50%;animation:conf 1.4s cubic-bezier(.2,.7,.4,1) var(--cd) both}
@keyframes palInL{from{transform:translateX(-70vw) rotate(-25deg)}to{transform:none}}
@keyframes palInR{from{transform:translateX(70vw) rotate(25deg)}to{transform:none}}
@keyframes cheer{from{transform:translateY(0) rotate(-6deg) scale(1)}to{transform:translateY(-28px) rotate(6deg) scale(1.06)}}
#shout{position:fixed;left:0;right:0;z-index:46;pointer-events:none;text-align:center;font:900 clamp(40px,13vw,74px)/1 system-ui,Arial;letter-spacing:1px;-webkit-text-stroke:2px #0008;display:none;transform:translateY(-50%);--g:#2bff6a;--d:#1d7a2c}
#shout .w{position:relative;display:inline-block;white-space:nowrap}
#shout .ch{display:inline-block;color:var(--c);text-shadow:0 5px 0 var(--d),0 0 22px var(--g);animation:chIn .55s cubic-bezier(.3,1.8,.5,1) calc(var(--i)*45ms) both,chWave 1.1s ease-in-out calc(.6s + var(--i)*60ms) infinite}
#shout .ring{position:absolute;left:50%;top:50%;width:1.6em;height:1.6em;margin:-.8em 0 0 -.8em;border-radius:50%;border:6px solid var(--g);box-shadow:0 0 25px var(--g),inset 0 0 25px var(--g);animation:ring .7s ease-out both;z-index:-1}
#shout .ring.r2{animation-delay:.15s;border-width:3px}
#shout .flash{position:absolute;inset:-30% -15%;background:radial-gradient(closest-side,var(--g),transparent);opacity:0;animation:flash .6s ease-out both;z-index:-1}
#shout .sp{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);filter:drop-shadow(0 0 4px var(--g));animation:spark .8s cubic-bezier(.2,.8,.4,1) calc(.1s + var(--i)*15ms) both}
#shout.good{--c:#9dffa8;--g:#2bff6a;--d:#1d7a2c}
#shout.great{--c:#8ae8ff;--g:#2bb8ff;--d:#1a5fa0}
#shout.incredible{--c:#ffa3f3;--g:#ff3bd8;--d:#8a1d86}
#shout.unstoppable{--c:#ffe066;--g:#ff6a00;--d:#b34a00;font-size:clamp(32px,10.5vw,64px)}
#shout.unstoppable .w{animation:shake .08s linear .35s 8}
#shout.unstoppable .ch{text-shadow:0 5px 0 var(--d),0 0 24px var(--g),0 0 50px #ff2a00}
#shout.out .ch{animation:chOut .4s ease-in calc(var(--i)*25ms) both}
#shout.out .sp,#shout.out .ring,#shout.out .flash{display:none}
@keyframes chIn{0%{transform:translateY(-70px) scale(.2) rotate(-25deg);opacity:0}70%{transform:translateY(6px) scale(1.2,.85);opacity:1}100%{transform:none}}
@keyframes chWave{0%,100%{translate:0 0}50%{translate:0 -6px}}
@keyframes chOut{to{transform:translateY(-60px) scale(1.3) rotate(10deg);opacity:0}}
@keyframes ring{0%{transform:scale(.2);opacity:1}100%{transform:scale(3.2);opacity:0}}
@keyframes flash{0%{opacity:0;transform:scale(.4)}30%{opacity:.55}100%{opacity:0;transform:scale(1.3)}}
@keyframes spark{0%{transform:translate(0,0) scale(0) rotate(0)}30%{transform:translate(calc(var(--x)*.6),calc(var(--y)*.6)) scale(1.4) rotate(90deg)}100%{transform:translate(var(--x),var(--y)) scale(0) rotate(220deg)}}
@keyframes shake{0%,100%{translate:0 0}25%{translate:-5px 2px}75%{translate:5px -2px}}
.stat span.bump{animation:bump .45s cubic-bezier(.3,1.8,.5,1)}
.stat span.bump.big{animation:bumpBig .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.3);color:#ffe066;text-shadow:0 0 12px #ffb400}100%{transform:scale(1)}}
@keyframes bumpBig{0%{transform:scale(1)}30%{transform:scale(1.55) rotate(-4deg);color:#ffe066;text-shadow:0 0 18px #ff8a00}60%{transform:scale(1.2) rotate(3deg)}100%{transform:scale(1)}}
.pts{position:fixed;z-index:44;pointer-events:none;font:900 22px/1 system-ui,Arial;color:#fff;-webkit-text-stroke:1px #0007;text-shadow:0 2px 0 #0006,0 0 10px #73e0ff;transform:translate(-50%,-50%);animation:popUp 1s cubic-bezier(.2,.9,.3,1) forwards;white-space:nowrap}
.pts.lines{font-size:34px;color:#ffe066;text-shadow:0 3px 0 #b36b00,0 0 16px #ffb400}
.pts.big{font-size:44px}
.pts.neg{color:#ff6b6b;text-shadow:0 2px 0 #7a1010,0 0 10px #ff3030}
.pts small{font-size:.6em;color:#ff9af3;margin-left:4px}
@keyframes popUp{0%{transform:translate(-50%,-30%) scale(.3);opacity:0}20%{transform:translate(-50%,-60%) scale(1.25);opacity:1}35%{transform:translate(-50%,-70%) scale(1)}100%{transform:translate(-50%,-260%) scale(.9);opacity:0}}
@keyframes multPop{0%{transform:scale(0) rotate(-30deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes partyOut{to{opacity:0;transform:scale(.85)}}
@keyframes conf{0%{transform:translate(0,0) rotate(0);opacity:0}8%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
@keyframes linepulse{from{opacity:.65}to{opacity:1}}
.cell.preview-line.filled::after{filter:brightness(1.3)}
@media (prefers-reduced-motion:reduce){.piece.special{animation:none!important}#shout .ch,#shout .w,.stat span.bump,.pts{animation:none!important}#shout .sp,#shout .ring,#shout .flash{display:none}.line-hl,#party .pal,#party .mult,#party .conf{animation:none!important}#party .conf{display:none}}
.cell.preview-invalid{outline:2px solid #ff5c76;background:#ff5c7688}
.hint{font-size:13px;opacity:.7;margin:12px 0 8px}.tray{display:flex;justify-content:space-around;gap:8px;align-items:center;min-height:105px}
.piece{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:10px;min-width:29%;min-height:92px;display:flex;justify-content:center;align-items:center;touch-action:none;cursor:grab}
.piece.special{border-color:var(--sc);box-shadow:0 0 10px color-mix(in srgb,var(--sc) 45%,transparent)}
.piece.special{padding-bottom:30px;background:linear-gradient(180deg,var(--panel) 55%,color-mix(in srgb,var(--sc) 22%,var(--panel)));animation:spGlow 1.6s ease-in-out infinite}
.piece .tag{position:absolute;left:50%;bottom:5px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;white-space:nowrap;max-width:94%;padding:3px 9px 3px 5px;border-radius:20px;background:var(--sc);color:#1a1630;font:800 11.5px/1.1 system-ui,Arial;box-shadow:0 2px 0 #0005,0 0 8px color-mix(in srgb,var(--sc) 60%,transparent)}
.piece .tag b{font-size:15px;line-height:1;filter:drop-shadow(0 1px 0 #0006)}
.piece .tag span{overflow:hidden;text-overflow:ellipsis}
.mini i[data-ic]{position:relative;display:flex;align-items:center;justify-content:center;font-size:var(--icfs,11px);line-height:1}
.mini i[data-ic]::after{content:attr(data-ic);filter:drop-shadow(0 1px 1px #0008)}
@keyframes spGlow{0%,100%{box-shadow:0 0 6px color-mix(in srgb,var(--sc) 35%,transparent)}50%{box-shadow:0 0 16px color-mix(in srgb,var(--sc) 75%,transparent)}}
.piece.used{opacity:.22;pointer-events:none}.piece.lifted{opacity:.35}
.mini{display:grid;grid-template-columns:repeat(3,17px);grid-auto-rows:17px;gap:3px}
.mini i{display:block;border-radius:3px;background:var(--tex),var(--pc,#5dd6ff);box-shadow:inset 2px 2px 0 -1px #ffffff45,inset -2px -2px 0 -1px #0000004d}#ghost .mini i:not(.empty){box-shadow:var(--bevel)}.mini i.empty{background:transparent;box-shadow:none}
button{font-family:inherit;cursor:pointer}
#message{min-height:22px;color:#a9f5ff;font-size:13px;margin-top:8px}
#ghost{position:fixed;z-index:99;pointer-events:none;opacity:.92;display:none;filter:drop-shadow(0 6px 10px #0009)}
#ghost .mini i{border-radius:5px}
@media(max-width:380px){:root{--gap:3px}#board{padding:5px}.mini{grid-template-columns:repeat(3,14px);grid-auto-rows:14px}}

/* ===== TELAS DO MENU ===== */
.screen{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;overflow-y:auto;
 padding:calc(max(env(safe-area-inset-top),var(--safe-area-inset-top,0px)) + 24px) 20px calc(max(env(safe-area-inset-bottom),var(--safe-area-inset-bottom,0px)) + 24px)}
.screen.show{display:flex}
.screen.solid{background:radial-gradient(circle at top,#283064,#101329 60%),#101329}
.screen.dim{background:#0b0e22e0;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.card{width:min(100%,380px);background:var(--panel);border:1px solid #394477;border-radius:20px;padding:22px 18px;box-shadow:0 10px 40px #0008}
.card.wide{width:min(100%,460px)}
.card h2{margin:0 0 16px;font-size:24px;letter-spacing:1px;color:#8ef0ff}
.stack{display:flex;flex-direction:column;gap:10px;width:min(100%,320px);margin:0 auto}
.btn{width:100%;padding:14px 18px;font-size:17px;font-weight:700;border-radius:14px;background:#262c55;border:1px solid var(--line);color:var(--text)}
.btn.primary{background:linear-gradient(180deg,#7ceaff,#3b9cff);color:#08112b;border:0;box-shadow:0 4px 0 #1f5fb0,0 0 18px #35cfff55;font-size:20px;padding:16px}
.btn:active{transform:translateY(2px)}.btn.primary:active{box-shadow:0 2px 0 #1f5fb0}
.btn.small{font-size:14px;padding:11px 6px}.btn.off{opacity:.5}
.btn.link{background:none;border:0;opacity:.75;font-size:15px}
.toggles{display:flex;gap:10px}
.btn.rank{background:linear-gradient(180deg,#c9a7ff,#8b5cf6);color:#1a0b3a;border:0;box-shadow:0 4px 0 #5b2fb8}
.rankicon{font-size:64px;margin:-6px 0 6px;animation:lvPulse 1.6s ease-in-out infinite}
#rank .record{display:inline-block;margin:4px 0 14px}
.btn.levels{background:linear-gradient(180deg,#ffd66b,#ff9f2b);color:#3a2000;border:0;box-shadow:0 4px 0 #b35f00}
#goalBar{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--panel);border:1px solid #394477;border-radius:12px;padding:8px 12px;font-weight:800;font-size:15px}
#goalBar[hidden]{display:none}
#goalBar .gfill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#3b9cff55,#64f59b77);transition:width .5s cubic-bezier(.3,1.4,.5,1)}
#goalBar span{position:relative}#goalMoves{color:#ffd66b}#goalMoves.low{color:#ff6b6b;animation:bump .6s infinite}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:14px}
.lv{aspect-ratio:1;border-radius:14px;border:0;background:linear-gradient(180deg,#7ceaff,#3b9cff);color:#08112b;font:900 22px/1 system-ui,Arial;box-shadow:0 4px 0 #1f5fb0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.lv small{font-size:10px;letter-spacing:-1px;color:#ffb400;text-shadow:0 1px 0 #0006}
.lv.done{background:linear-gradient(180deg,#9dffa8,#2fcf6a);box-shadow:0 4px 0 #1d7a2c}
.lv.lock{background:#262c55;color:#56608f;box-shadow:none;font-size:18px}
.lv.cur{outline:3px solid #ffe066;outline-offset:2px;animation:lvPulse 1.2s ease-in-out infinite}@keyframes lvPulse{50%{transform:scale(1.07)}}
.stars{font-size:44px;letter-spacing:6px;margin:-4px 0 6px}
.stars i{font-style:normal;display:inline-block;filter:grayscale(1) brightness(.5)}
.stars i.on{filter:drop-shadow(0 0 10px #ffb400);animation:starIn .5s cubic-bezier(.3,1.8,.5,1) both}
@keyframes starIn{0%{transform:scale(0) rotate(-90deg)}100%{transform:none}}
.lvwhy{margin:0 0 12px;font-weight:700;color:#c9d2ff}
.stat small,.final small{font-size:inherit;display:block}
#langList .btn{display:flex;align-items:center;gap:12px;text-align:left}#langList .btn .flag{font-size:22px}#langList .btn .ok{margin-left:auto;color:#64f59b;font-size:20px}#langList .btn.sel{border-color:#73e0ff;box-shadow:0 0 0 2px #73e0ff55}#langBack{margin-top:10px}
#menu h1{margin:6px 0 0;font-size:clamp(34px,11vw,52px);line-height:1;color:#8ef0ff;text-shadow:0 0 18px #35cfff;letter-spacing:1px}
.logo{display:grid;grid-template-columns:repeat(7,clamp(22px,7vw,30px));grid-auto-rows:clamp(22px,7vw,30px);gap:4px}
.logo i{border-radius:6px;background:var(--tex),var(--c);box-shadow:var(--bevel),0 0 8px color-mix(in srgb,var(--c) 45%,transparent);animation:land .34s cubic-bezier(.3,1.4,.5,1) var(--d,0ms) both}
.logo i.e{visibility:hidden}
.record{background:var(--panel);border:1px solid #394477;border-radius:999px;padding:8px 18px;font-weight:700}.record b{color:#ffd66b}
.ver{font-size:11px;opacity:.4}
.final{display:flex;gap:10px;margin:0 0 16px}
.final div{flex:1;background:#262c55;border-radius:14px;padding:10px;font-weight:700;font-size:13px}.final b{display:block;font-size:30px;color:#8ef0ff}
.newrec{margin:-6px 0 14px;font-weight:800;color:#ffd66b;text-shadow:0 0 12px #ffb13b88}
.rules{text-align:left;margin:0 0 14px;padding-left:20px;line-height:1.45;font-size:15px}.rules li{margin:4px 0}
.card h3{margin:4px 0 8px;font-size:16px;text-align:left}
.specials{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.specials div{display:flex;gap:10px;align-items:center;text-align:left;background:#262c55;border-radius:12px;padding:8px 10px;font-size:14px}
.specials span{font-size:24px;flex:0 0 30px;text-align:center}
.specials p{margin:0}

/* ===== ANIMAÇÕES NOS BLOCOS (todas no ::after de cada casa, com atraso --d) ===== */
.cell[class*="fx-"]::after{animation-delay:var(--d,0ms);animation-fill-mode:both}
.cell.fx-fall,.cell.fx-explode,.cell.fx-land{z-index:2}

/* peça encaixando: cai com leve achatamento */
.fx-land::after{animation:land .34s cubic-bezier(.3,1.4,.5,1)}
@keyframes land{0%{transform:translateY(-45%) scale(1.2);opacity:0}55%{transform:translateY(0) scale(1.08,.86);opacity:1}100%{transform:none}}

/* linha/coluna completa: brilha e gira sumindo, em onda */
.fx-clear::after{animation:clear .42s ease-in}
@keyframes clear{0%{transform:none}25%{transform:scale(1.14);filter:brightness(2.4)}100%{transform:scale(0) rotate(45deg);opacity:0;filter:brightness(2.4)}}

/* explosivo: treme, esquenta e estoura */
.fx-explode::after{animation:explode .6s linear}
@keyframes explode{
 0%{transform:none}
 10%{transform:translate(-9%,4%)}20%{transform:translate(9%,-4%)}30%{transform:translate(-7%,-5%)}
 40%{transform:translate(7%,5%);background:#ffb13b;box-shadow:0 0 12px 3px #ff6a2b}
 55%{transform:scale(1.35) rotate(var(--rot,0deg));background:#fff3a0;box-shadow:0 0 18px 7px #ff8a2b;opacity:1}
 100%{transform:scale(.1) rotate(calc(var(--rot,0deg) * 3));background:#ff4b2b;opacity:0}}

/* derrete: vira gelo, escorre para baixo e pinga */
.fx-melt::after{transform-origin:50% 0;animation:melt .75s ease-in}
@keyframes melt{
 0%{transform:none}
 25%{background:#a8f1ff;box-shadow:0 0 10px #54dfff}
 60%{transform:scale(1.08,1.35);border-radius:30% 30% 50% 50%/20% 20% 80% 80%;background:#4bc7ef}
 100%{transform:translateY(70%) scale(.6,1.6);border-radius:50%/30% 30% 70% 70%;background:#2689d1;opacity:0}}

/* areia: blocos esfarelam e se assentam */
.fx-sandify::after{animation:sandify .45s ease-out}
:root{--ruby:radial-gradient(circle at 30% 24%,#fff 0 3%,#fff0 10%),radial-gradient(circle at 68% 72%,#ffffffa0 0 2%,#fff0 7%),linear-gradient(135deg,#ff9cb0,#e8174a 45%,#a1052c) center/46% 46% no-repeat,conic-gradient(from -45deg,#ff5574 0 12.5%,#e8123f 0 25%,#b3062d 0 37.5%,#7c001b 0 50%,#5a0012 0 62.5%,#8f0222 0 75%,#d40c3a 0 87.5%,#ff7d96 0);
 --cut:polygon(20% 0,80% 0,100% 20%,100% 80%,80% 100%,20% 100%,0 80%,0 20%)}
/* modo rubi: liga com um combo triplo (3+ linhas de uma vez) e vale até o fim da partida */
body.gems{background:#FCFCDA}body.gems .hint{color:#3a2a1a}body.gems #message{color:#b3062d;font-weight:700}
body.gems .cell.filled:not(.sand)::after{background:var(--ruby);border-radius:0;clip-path:var(--cut);box-shadow:none}
body.gems .cell.filled:not(.sand){filter:drop-shadow(0 0 5px #ff1f4d90)}
body.gems .mini i:not(.empty){background:var(--ruby);border-radius:0;clip-path:var(--cut);box-shadow:none}
.fx-gem::after{animation:gem .6s ease-out var(--d,0ms) both}
@keyframes gem{0%{transform:scale(.6) rotate(-20deg);filter:brightness(2.6)}60%{transform:scale(1.12) rotate(4deg);filter:brightness(1.5)}100%{transform:none}}
@keyframes sandify{0%{transform:scale(1.15);filter:brightness(1.8)}35%{transform:scale(.88) rotate(-5deg)}65%{transform:scale(1.04) rotate(3deg)}100%{transform:none}}

/* blocos que mudaram de linha (areia caindo / ímã puxando) deslizam até a nova casa */
.fx-fall::after{animation:fall .45s cubic-bezier(.45,0,.55,1.3)}
@keyframes fall{from{transform:translateY(calc(var(--fy,0) * (100% + var(--gap))))}to{transform:none}}

/* ímã: blocos vibram com contorno vermelho/azul antes de serem puxados */
.fx-magnet::after{animation:magnet .5s ease-in-out}
@keyframes magnet{0%,100%{transform:none}
 20%{transform:translateY(-6%);box-shadow:0 0 0 2px #ff5c76,0 0 10px #ff5c76}
 50%{transform:translateY(-14%);box-shadow:0 0 0 2px #65dfff,0 0 12px #65dfff}
 80%{transform:translateY(-6%);box-shadow:0 0 0 2px #ff5c76,0 0 10px #ff5c76}}

/* limpa tudo: onda diagonal, cada bloco fica branco e gira até sumir */
.fx-wipe::after{animation:wipe .5s ease-in}
@keyframes wipe{30%{background:#fff;transform:scale(1.1);box-shadow:0 0 12px #8ef0ff}100%{transform:scale(0) rotate(180deg);background:#8ef0ff;opacity:0}}

/* fim de jogo: blocos apagam em onda */
.fx-dead::after{animation:dead .5s ease-out}
@keyframes dead{to{filter:grayscale(1) brightness(.5);transform:scale(.88)}}

/* peças novas na bandeja: blocos brotam um a um */
.piece.new .mini i:not(.empty){animation:spawn .3s cubic-bezier(.3,1.6,.5,1) var(--d,0ms) both}
@keyframes spawn{from{transform:scale(0)}to{transform:none}}

@media (prefers-reduced-motion:reduce){.cell[class*="fx-"]::after,.piece.new .mini i,.logo i{animation-duration:1ms!important;animation-delay:0ms!important}}
</style>
</head>

/* ===== DATA SAVE =====
   Tudo que o jogo guarda fica num único objeto (DATA), salvo em 2 lugares:
   1) Preferences do Capacitor: armazenamento nativo do Android. O sistema não limpa,
      e entra no backup automático do Google (volta ao reinstalar ou trocar de celular).
   2) localStorage: cópia rápida, e é o que funciona quando o jogo roda no navegador.
   Cada lugar guarda também a versão anterior (_bak). Ao abrir, o jogo usa a cópia válida
   mais recente. Se uma estiver corrompida, usa a outra. O recorde nunca diminui. */
const DATA_KEY='blocosmalucos_data',DATA_VERSION=1;
const Prefs=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Preferences;
const defaultData=()=>({v:DATA_VERSION,savedAt:0,best:0,music:true,sfx:true,seenHelp:false,lang:null,game:null,levels:{stars:[]}});
let DATA=defaultData(),lastRaw=null;
const parseJSON=r=>{try{return JSON.parse(r)}catch(e){return null}};
const validData=d=>d&&typeof d==='object'&&typeof d.best==='number'&&isFinite(d.best)?d:null;
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
async function prefGet(k){if(!Prefs)return null;try{return (await Prefs.get({key:k})).value}catch(e){return null}}
function prefSet(k,v){if(Prefs)Prefs.set({key:k,value:v}).catch(()=>{})}
function migrateOld(){ // traz os dados das versões antigas do jogo (chaves bb*)
 const d=defaultData();
 d.best=Number(lsGet('bbBest'))||0;d.sfx=lsGet('bbMute')!=='1';d.music=lsGet('bbMusic')!=='0';d.seenHelp=lsGet('bbHelp')==='1';
 d.game=parseJSON(lsGet('bbSave'));
 return d;
}
async function loadData(){
 const raws=await Promise.all([prefGet(DATA_KEY),prefGet(DATA_KEY+'_bak')]);
 raws.push(lsGet(DATA_KEY),lsGet(DATA_KEY+'_bak'));
 const found=raws.map(r=>r&&validData(parseJSON(r))).filter(Boolean).sort((a,b)=>(b.savedAt||0)-(a.savedAt||0));
 DATA=Object.assign(defaultData(),found[0]||migrateOld(),{v:DATA_VERSION});
 DATA.best=Math.max(DATA.best,...found.map(x=>x.best||0));
 persist();
}
function persist(){
 DATA.savedAt=Date.now();
 const raw=JSON.stringify(DATA);
 if(lastRaw){lsSet(DATA_KEY+'_bak',lastRaw);prefSet(DATA_KEY+'_bak',lastRaw)}
 lsSet(DATA_KEY,raw);prefSet(DATA_KEY,raw);
 lastRaw=raw;
}

/* ===== SONS (pasta sounds/) =====
   v = qual versão do arquivo usar (explosao e pecas_novas têm 1 a 4, os outros 1 e 2). vol = volume relativo.
   file = usa um arquivo com outro nome (ignora o v). max = duração máxima em segundos. fade = parte final que vai sumindo (0 a 1). */
const SFX={
 encaixar:{v:1,vol:.55}, pecas_novas:{v:3,vol:.4}, erro:{v:1,vol:.5}, linha:{v:1,vol:.8},
 explosao:{file:'audio da bomba.mp4',vol:.6,max:2.5,fade:.2}, derrete:{v:1,vol:.7}, areia:{v:1,vol:.65}, ima:{v:1,vol:.7},
 limpa_tudo:{v:1,vol:.8}, fim:{v:1,vol:.75},
 voz_good:{v:2,vol:1.5}, voz_great:{v:2,vol:1.5}, voz_incredible:{v:1,vol:1.5}, voz_unstoppable:{v:2,vol:1.5}
};
const EFEITOS_VOL=2; // volume geral de TODOS os efeitos (1 = antigo, 2 = dobro). Um limitador evita que estoure.
let master=null;
let actx=null,muted=false; // vem do DATA ao abrir
const sounds={};
function initAudio(){
 if(actx)return;
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 actx=new AC();
 // volume geral -> limitador -> alto-falante (deixa mais alto sem distorcer)
 const lim=actx.createDynamicsCompressor();
 lim.threshold.value=-3;lim.knee.value=2;lim.ratio.value=20;lim.attack.value=.002;lim.release.value=.15;
 master=actx.createGain();master.gain.value=EFEITOS_VOL;
 master.connect(lim).connect(actx.destination);
 for(const k in SFX)loadSound(k);
}
async function loadSound(k){
 const url='sounds/'+encodeURIComponent(SFX[k].file||`${k}_${SFX[k].v}.mp3`);
 try{
  const buf=await actx.decodeAudioData(await (await fetch(url)).arrayBuffer());
  const d=buf.getChannelData(0);let peak=0,start=0;
  for(let i=0;i<d.length;i++){const a=Math.abs(d[i]);if(a>peak)peak=a}
  for(let i=0;i<d.length;i++)if(Math.abs(d[i])>peak*.08){start=Math.max(0,i/buf.sampleRate-.004);break} // pula o silêncio do começo
  // iguala pela altura média (RMS) da parte com som, sem deixar o pico estourar
  let sum=0,n=0;for(let i=Math.floor(start*buf.sampleRate);i<d.length;i++){const a=Math.abs(d[i]);if(a>peak*.05){sum+=a*a;n++}}
  const rms=n?Math.sqrt(sum/n):peak;
  sounds[k]={buf,start,norm:peak>0?Math.min(.18/rms,.95/peak):1};
 }catch(e){sounds[k]={el:new Audio(url)}} // reserva para quando o arquivo é aberto direto no navegador (file://)
}
function play(k,rate=1){
 if(muted||!actx||!sounds[k])return;
 if(actx.state==='suspended')actx.resume();
 const s=sounds[k],vol=SFX[k].vol;
 if(s.buf){
  const src=actx.createBufferSource(),g=actx.createGain();
  src.buffer=s.buf;src.playbackRate.value=rate;
  // envelope: entrada rápida e saída suave no final do som (nada corta seco)
  const t=actx.currentTime,len=Math.min((s.buf.duration-s.start)/rate,SFX[k].max||99),v=vol*s.norm,fade=SFX[k].fade??.35;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);
  g.gain.setValueAtTime(v,t+len*(1-fade));g.gain.linearRampToValueAtTime(0,t+len);src.stop(t+len+.05);
  src.connect(g).connect(master);src.start(t,s.start);
 }else{const a=s.el.cloneNode();a.volume=Math.min(1,vol*EFEITOS_VOL);a.playbackRate=rate;a.play().catch(()=>{});if(SFX[k].max)setTimeout(()=>a.pause(),SFX[k].max*1000/rate)}
}

function outlineLine(cells){ // contorna as casas de uma linha ou coluna inteira
 const a=cells[0],b=cells[cells.length-1],o=document.createElement('div');o.className='line-hl';
 const pad=3;o.style.left=(a.offsetLeft-pad)+'px';o.style.top=(a.offsetTop-pad)+'px';
 o.style.width=(b.offsetLeft+b.offsetWidth-a.offsetLeft+pad*2)+'px';o.style.height=(b.offsetTop+b.offsetHeight-a.offsetTop+pad*2)+'px';

function preview(p,r,c){clearPreview();const ok=canPlace(p,r,c);p.shape.forEach(([y,x])=>{if(r+y>=0&&r+y<N&&c+x>=0&&c+x<N)cellEl(r+y,c+x).classList.add(ok?'preview-valid':'preview-invalid')});

  const will=(y,x)=>grid[y][x]||p.shape.some(([dy,dx])=>r+dy===y&&c+dx===x),idx=[...Array(N).keys()];
  idx.forEach(y=>{if(idx.every(x=>will(y,x)))outlineLine(idx.map(x=>cellEl(y,x)))});
  idx.forEach(x=>{if(idx.every(y=>will(y,x)))outlineLine(idx.map(y=>cellEl(y,x)))});

/* ---------- arrastar: a peça fantasma tem o tamanho real das casas e fica acima do dedo ---------- */
function startDrag(e,i){
 if(busy||pieces[i].used)return;e.preventDefault();
 const p=pieces[i],a=cellEls[0].getBoundingClientRect(),b=cellEls[1].getBoundingClientRect();
 const cols=Math.max(...p.shape.map(s=>s[1]))+1;
 drag={i,p,row:null,col:null,valid:false,size:a.width,step:b.left-a.left};
 ghost.innerHTML='';ghost.append(miniFor(p,cols,a.width));ghost.style.display='block';
 trayEl.children[i].classList.add('lifted');
 moveDrag(e);
 window.addEventListener('pointermove',moveDrag);
 window.addEventListener('pointerup',endDrag,{once:true});
 window.addEventListener('pointercancel',cancelDrag,{once:true});
}
function moveDrag(e){
 if(!drag)return;
 const gw=ghost.offsetWidth,gh=ghost.offsetHeight,lift=e.pointerType==='mouse'?gh/2:gh+30;
 const gx=e.clientX-gw/2,gy=e.clientY-lift;
 ghost.style.left=gx+'px';ghost.style.top=gy+'px';
 const br=boardEl.getBoundingClientRect(),o=cellEls[0].getBoundingClientRect();
 const cx=gx+gw/2,cy=gy+gh/2;
 if(cx<br.left||cx>br.right||cy<br.top||cy>br.bottom){clearPreview();drag.row=drag.col=null;drag.valid=false;return}
 const c=Math.round((gx-o.left)/drag.step),r=Math.round((gy-o.top)/drag.step);
 if(r===drag.row&&c===drag.col)return;
 drag.row=r;drag.col=c;drag.valid=preview(drag.p,r,c);
}
function stopDrag(){ghost.style.display='none';clearPreview();window.removeEventListener('pointermove',moveDrag);window.removeEventListener('pointercancel',cancelDrag);const t=drag&&trayEl.children[drag.i];if(t)t.classList.remove('lifted');const d=drag;drag=null;return d}
function endDrag(){if(!drag)return;const d=stopDrag();if(d.valid)placePiece(d.i,d.row,d.col);else if(d.row!==null){msg.textContent=t('dropGreen');play('erro')}}

let shoutT;
function shout(k){ // mostra Good! / Great! / Incredible! / Unstoppable! em cima do tabuleiro
 const el=$('#shout'),r=boardEl.getBoundingClientRect(),txt=k.toUpperCase()+'!';
 clearTimeout(shoutT);el.className=k;el.style.top=(r.top+r.height*.26)+'px';
 const n={good:8,great:12,incredible:16,unstoppable:22}[k];
 let h='<div class="w"><i class="flash"></i><i class="ring"></i><i class="ring r2"></i>';
 [...txt].forEach((c,i)=>h+=`<span class="ch" style="--i:${i}">${c}</span>`);
 for(let i=0;i<n;i++){const a=i/n*6.283+Math.random()*.4,d=90+Math.random()*90;h+=`<i class="sp" style="--i:${i};--x:${Math.cos(a)*d*1.6|0}px;--y:${Math.sin(a)*d|0}px"></i>`}

 shoutT=setTimeout(()=>{el.classList.add('out');shoutT=setTimeout(()=>el.style.display='none',400+txt.length*25)},1250);

function setNum(el,v){cancelAnimationFrame(el._raf);el._v=v;el.textContent=v}
function countTo(el,to,big){ // números sobem rolando até o valor novo
 cancelAnimationFrame(el._raf);const from=el._v??(+el.textContent||0);el._v=to;
 el.classList.remove('bump','big');void el.offsetWidth;el.classList.add('bump');if(big)el.classList.add('big');
 if(reduce){el.textContent=to;return}
 let t0=0;const ms=Math.min(900,250+Math.abs(to-from)*1.2);
 const step=now=>{if(!t0)t0=now;const p=Math.max(0,Math.min(1,(now-t0)/ms)),e=1-Math.pow(1-p,3);el.textContent=Math.round(from+(to-from)*e);if(p<1)el._raf=requestAnimationFrame(step)};
 el._raf=requestAnimationFrame(step);
}
function popPoints(n,at,cls){ // +pontos flutuando de onde a jogada aconteceu
 if(!at)return;const r=boardEl.getBoundingClientRect(),cw=(r.width-14)/N;
 const d=document.createElement('div');d.className='pts '+(cls||'')+(n<0?' neg':'')+(n>=600?' big':'');
 d.innerHTML=(n>0?'+':'')+n+(n>0&&triples>1?`<small>X${triples}</small>`:'');
 d.style.left=Math.max(50,Math.min(innerWidth-50,r.left+7+(at[1]+.5)*cw))+'px';d.style.top=(r.top+7+(at[0]+.5)*cw)+'px';
 document.body.appendChild(d);setTimeout(()=>d.remove(),1000);
}
function addPoints(n,at,cls){if(n>0)n*=Math.max(1,triples); // multiplicador X2, X3... dos combos triplos
 score+=n;popPoints(n,at,cls);countTo(scoreEl,score,n>=200);if(mode==='classic'&&score>best){best=score;countTo(bestEl,best,n>=200);saveBest()}if(mode==='level')drawGoal()}

/* ---------- jogada ---------- */
async function placePiece(i,r,c){
 const p=pieces[i],g=gen;
 if(!canPlace(p,r,c)){msg.textContent=t('occupied');return}
 busy=true;p.used=true;drawTray(false);
 const fx=async(...a)=>{await fxRun(...a);if(g!==gen)throw 'cancelado'}; // para no meio se começou outra partida
 try{
 const cells=p.shape.map(([y,x])=>[r+y,c+x]);
 const midY=cells.reduce((s,a)=>s+a[0],0)/cells.length,midX=cells.reduce((s,a)=>s+a[1],0)/cells.length;
 cells.forEach(([y,x])=>grid[y][x]={color:p.color,sand:false});
 addPoints(p.shape.length*10,[midY,midX]);
 drawBoard();play('encaixar',.95+Math.random()*.12);
 await fx(cells.map(([y,x],k)=>[y,x,k*35]),'fx-land',340);

 if(p.type==='Explosivo'){
  const hit=new Map();
  cells.forEach(([a,b])=>{for(let y=a-1;y<=a+1;y++)for(let x=b-1;x<=b+1;x++)if(y>=0&&y<N&&x>=0&&x<N&&grid[y][x])hit.set(y*N+x,[y,x])});
  msg.textContent=t('boom');buzz([30,40,60]);setTimeout(()=>play('explosao'),reduce?0:300);
  await fx([...hit.values()].map(([y,x])=>[y,x,Math.max(Math.abs(y-midY),Math.abs(x-midX))*70,{'--rot':(Math.random()*80-40|0)+'deg'}]),'fx-explode',600);
  hit.forEach(([y,x])=>grid[y][x]=null);addPoints(-10,[midY,midX]);drawBoard();
 }
 if(p.type==='Derrete'){
  const hit=[];for(let y=r;y<Math.min(N,r+2);y++)for(let x=c;x<Math.min(N,c+2);x++)if(grid[y][x])hit.push([y,x]);
  msg.textContent=t('melted');play('derrete');
  await fx(hit.map(([y,x])=>[y,x,(x-c)*60+(y-r)*120]),'fx-melt',750);
  hit.forEach(([y,x])=>grid[y][x]=null);drawBoard();
 }
 if(p.type==='Areia'){
  const hit=[];
  for(let y=Math.max(0,r-1);y<=Math.min(N-1,r+1);y++)for(let x=Math.max(0,c-1);x<=Math.min(N-1,c+1);x++)if(grid[y][x]){grid[y][x]={color:'#e6b75d',sand:true};hit.push([y,x])}
  msg.textContent=t('sanded');drawBoard();play('areia');
  await fx(hit.map(([y,x])=>[y,x,(Math.random()*120)|0]),'fx-sandify',450);
  const moved=[];
  for(let x=0;x<N;x++){
   const vals=[];for(let y=N-1;y>=0;y--)if(grid[y][x])vals.push([grid[y][x],y]);
   for(let y=N-1;y>=0;y--){const v=vals[N-1-y];grid[y][x]=v?v[0]:null;if(v&&v[1]!==y)moved.push([y,x,x*15,{'--fy':v[1]-y}])}
  }
  drawBoard();if(moved.length)await fx(moved,'fx-fall',450);
 }
 if(p.type==='Ímã'){
  const found=[];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(grid[y][x]&&Math.max(Math.abs(y-r),Math.abs(x-c))<=2&&!(y>=r&&y<r+2&&x>=c&&x<c+2))found.push([y,x,grid[y][x]]);
  msg.textContent=t('magnet');play('ima');
  await fx(found.map(([y,x])=>[y,x,0]).concat(cells.map(([y,x])=>[y,x,0])),'fx-magnet',500);
  const moved=[];
  found.forEach(([y,x,v])=>{const ny=Math.max(0,y-1);if(ny!==y&&!grid[ny][x]){grid[ny][x]=v;grid[y][x]=null;moved.push([ny,x,0,{'--fy':1}])}});
  drawBoard();if(moved.length)await fx(moved,'fx-fall',450);
 }
 if(p.type==='Limpa tudo'){
  const hit=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(grid[y][x])hit.push([y,x,(y+x)*28]);
  msg.textContent=t('cleared');buzz(80);play('limpa_tudo');
  await fx(hit,'fx-wipe',500);
  grid=emptyGrid();addPoints(300,[4.5,4.5],'lines');drawBoard();
 }

 /* linhas e colunas completas */
 const rows=[],colsFull=[];
 for(let y=0;y<N;y++)if(grid[y].every(Boolean))rows.push(y);
 for(let x=0;x<N;x++)if(grid.every(row=>row[x]))colsFull.push(x);
 const lines=rows.length+colsFull.length;
 if(lines){
  const hit=new Map(),put=(y,x,d)=>{const k=y*N+x;if(!hit.has(k)||hit.get(k)[2]>d)hit.set(k,[y,x,d])};
  rows.forEach(y=>{for(let x=0;x<N;x++)put(y,x,Math.abs(x-midX)*35)});
  colsFull.forEach(x=>{for(let y=0;y<N;y++)put(y,x,Math.abs(y-midY)*35)});
  buzz(lines>1?[40,30,40]:40);play('linha',Math.min(1.5,1+(lines-1)*.12)); // combo = som mais agudo
  const voz=lines>=4?'voz_unstoppable':lines===3?'voz_incredible':lines===2?'voz_great':'voz_good';
  setTimeout(()=>{play(voz);shout(voz.slice(4))},reduce?0:180); // locutor: Good / Great / Incredible / Unstoppable + texto na tela
  await fx([...hit.values()],'fx-clear',420);
  hit.forEach(([y,x])=>grid[y][x]=null);
  addPoints(lines*100,[rows.length?rows.reduce((a,b)=>a+b)/rows.length:midY,colsFull.length?colsFull.reduce((a,b)=>a+b)/colsFull.length:midX],'lines');drawBoard();
 }
 if(lines)msg.textContent=lines>1?t('combo',lines):t('oneLine');
 if(lines>=3){triples++;celebrate(triples);drawMult()} // combo triplo: os personagens comemoram
 if(lines>=3&&!gems){ // combo triplo: os blocos viram rubis
  setGems(true);msg.textContent=t('ruby');buzz([30,40,30,40,60]);play('limpa_tudo',1.25);
  const all=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(grid[y][x])all.push([y,x,(y+x)*30]);
  drawTray(false);await fx(all,'fx-gem',600);drawBoard();
 }
 else if(p.type==='Normal')msg.textContent=t('keepGoing');

 if(pieces.every(x=>x.used))makePieces();
 busy=false;
 if(mode==='level')await levelAfterMove(g,lines);
 else if(!pieces.some(x=>!x.used&&findAny(x)))await gameOver(g);else saveGame();
 }catch(e){if(e!=='cancelado')throw e}
}
function celebrate(n){
 const el=$('#party');clearTimeout(partyTimer);
 el.classList.remove('on','out');void el.offsetWidth; // reinicia as animações
 $('#partyMult').textContent='X'+n;
 el.querySelectorAll('.conf').forEach(c=>c.remove());
 const cols=['#64f59b','#ff79bd','#ffe066','#59d8ff','#a78bfa','#ff7b69'];
 for(let i=0;i<28;i++){const c=document.createElement('i');c.className='conf';const left=i%2===0;
  c.style.cssText=`--cc:${cols[i%6]};--dx:${(left?-1:1)*(40+Math.random()*150)}px;--dy:${-230+Math.random()*330}px;--cd:${250+Math.random()*450}ms`;el.prepend(c)}
 el.classList.add('on');buzz([40,60,40,60,80]);
 partyTimer=setTimeout(()=>{el.classList.add('out');partyTimer=setTimeout(hideParty,350)},reduce?1200:2600);
}
function drawMult(){const b=$('#multBadge');if(!b)return;b.hidden=triples<2;b.textContent='x'+triples;b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')}
function hideParty(){clearTimeout(partyTimer);const el=$('#party');if(el)el.classList.remove('on','out')}
function setGems(on){gems=on;document.body.classList.toggle('gems',on);
 try{const SB=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.SystemBars;if(SB)SB.setStyle({style:on?'LIGHT':'DARK'}).catch(()=>{})}catch(e){} // ícones da barra do Android escuros no fundo claro
}
function findAny(p){for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(canPlace(p,r,c))return true;return false}
async function gameOver(g){
 busy=true;hasGame=false;clearSave();sendScore(score);
 msg.textContent=t('gameOverMsg');buzz(200);play('fim');if(musicOn&&!music.paused)fadeMusic(MUSICA.vol*.35,600);
 const hit=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(grid[y][x])hit.push([y,x,(N-1-y)*45+x*10]);
 await fxRun(hit,'fx-dead',500);await wait(reduce?0:450);
 if(g!==gen)return;
 busy=false;
 $('#overScore').textContent=score;$('#overBest').textContent=best;
 $('#newRec').hidden=!(score>bestAtStart&&score>0);
 show('over');
}

/* ===== PARTIDA ===== */
function newGame(){
 gen++;busy=false;if(drag)stopDrag();
 grid=emptyGrid();score=0;setNum(scoreEl,0);bestAtStart=best;msg.textContent='';setGems(false);triples=0;drawMult();hideParty();
 hasGame=true;drawBoard();makePieces();saveGame();
 if(musicOn&&!music.paused)fadeMusic(MUSICA.vol,600);
}

/* ===== TELAS: menu | game | pause | over | howto ===== */
/* ===== MODO FASES =====
   Cada fase: g = objetivo ('lines' = limpar linhas, 'score' = fazer pontos), n = quanto,
   m = quantas peças você tem (0 = sem limite), map = blocos que já começam no tabuleiro
   (linhas de baixo, '#' = bloco). */
const LEVELS=[
 {g:'lines',n:2,m:0,map:['####.#####','####.#####']},
 {g:'lines',n:3,m:0,map:['##.####.##','##.####.##','##.####.##']},
 {g:'score',n:800,m:0,map:[]},
 {g:'lines',n:4,m:20,map:['#.#.#.#.#.','.#.#.#.#.#']},
 {g:'lines',n:5,m:20,map:['###....###','###....###','###....###']},
 {g:'score',n:1500,m:25,map:['#........#','##......##','###....###']},
 {g:'lines',n:6,m:22,map:['.########.','.########.','.########.','.########.']},
 {g:'lines',n:5,m:18,map:['##..##..##','##..##..##']},
 {g:'score',n:2000,m:25,map:['....##....','...####...','..######..']},
 {g:'lines',n:8,m:26,map:['#.#.#.#.#.','#.#.#.#.#.','#.#.#.#.#.','#.#.#.#.#.']},
 {g:'lines',n:6,m:18,map:['#########.','.#########','#########.','.#########']},
 {g:'score',n:3000,m:30,map:['###..###..','..###..###']},
 {g:'lines',n:8,m:22,map:['#....#....','##..###..#','###.####.#']},
 {g:'lines',n:10,m:28,map:['##.##.##.#','#.##.##.##','.##.##.##.']},
 {g:'score',n:4000,m:30,map:['#.........','##........','###.......','####......','#####.....']},
 {g:'lines',n:10,m:25,map:['#..#..#..#','#..#..#..#','#..#..#..#','#..#..#..#','#..#..#..#']},
 {g:'lines',n:12,m:30,map:['..######..','.#......#.','#........#']},
 {g:'score',n:5000,m:32,map:['#.#.#.#.#.','.#.#.#.#.#','#.#.#.#.#.','.#.#.#.#.#']},
 {g:'lines',n:12,m:26,map:['###.##.###','##.####.##','#.######.#','.########.']},
 {g:'score',n:6000,m:35,map:['.#.#.#.#.#','#.#.#.#.#.','##..##..##','..##..##..','####..####']},
];
let mode='classic',lvl=0,lvlLines=0,lvlLeft=0;
const lvData=()=>{if(!DATA.levels||!Array.isArray(DATA.levels.stars))DATA.levels={stars:[]};return DATA.levels};
const lvUnlocked=()=>Math.min(LEVELS.length-1,lvData().stars.filter(x=>x>0).length);
function drawLevels(){
 const box=$('#lvGrid'),st=lvData().stars,open=lvUnlocked();box.innerHTML='';
 LEVELS.forEach((L,i)=>{
  const b=document.createElement('button'),lock=i>open&&!(st[i]>0);
  b.className='lv'+(lock?' lock':st[i]>0?' done':'')+(i===open&&!(st[i]>0)?' cur':'');
  b.innerHTML=lock?'🔒':`${i+1}<small>${st[i]>0?'★'.repeat(st[i])+'☆'.repeat(3-st[i]):''}</small>`;
  if(!lock)b.onclick=()=>{play('encaixar',1.3);startLevel(i)};
  box.append(b);
 });
}
function drawGoal(){
 const L=LEVELS[lvl],have=L.g==='lines'?lvlLines:score;
 $('#goalTxt').textContent='🎯 '+t(L.g==='lines'?'goalLines':'goalScore',L.n)+': '+Math.min(have,L.n)+'/'+L.n;
 $('#goalFill').style.width=Math.min(100,have/L.n*100)+'%';
 const gm=$('#goalMoves');gm.textContent=L.m?'🧩 '+lvlLeft:'';gm.classList.toggle('low',!!L.m&&lvlLeft<=3);
}
function setHud(){ // placar de cima: modo clássico mostra o recorde, modo fases mostra a fase
 const lab=document.querySelector('.stat small[data-i=best]');
 $('#goalBar').hidden=mode!=='level';
 if(mode==='level'){lab.textContent=t('level');setNum(bestEl,lvl+1);drawGoal()}
 else{lab.textContent=t('best');setNum(bestEl,best)}
}
function startLevel(i){
 const L=LEVELS[i];gen++;busy=false;if(drag)stopDrag();
 mode='level';lvl=i;lvlLines=0;lvlLeft=L.m;
 grid=emptyGrid();
 L.map.forEach((row,k)=>{const y=N-L.map.length+k;[...row].forEach((ch,x)=>{if(ch==='#')grid[y][x]={color:'#8a93c4',sand:false}})});
 score=0;setNum(scoreEl,0);msg.textContent=t(L.g==='lines'?'goalLines':'goalScore',L.n);
 setGems(false);triples=0;drawMult();hideParty();
 drawBoard();makePieces();setHud();show('game');
 if(musicOn&&!music.paused)fadeMusic(MUSICA.vol,600);
}
function backToClassic(){ // volta a partida normal que estava salva
 if(mode!=='level')return;
 mode='classic';gen++;busy=false;
 if(loadGame()){hasGame=true;setNum(scoreEl,score);drawBoard();drawTray(false)}
 else{hasGame=false;score=0;setNum(scoreEl,0);grid=emptyGrid();setGems(false);triples=0;drawMult();drawBoard();makePieces()}
 setHud();
}
async function levelAfterMove(g,lines){ // depois de cada jogada no modo fases
 const L=LEVELS[lvl];lvlLines+=lines;if(L.m)lvlLeft--;drawGoal();
 const won=(L.g==='lines'?lvlLines:score)>=L.n;
 if(won)return levelEnd(g,true);
 if(L.m&&lvlLeft<=0)return levelEnd(g,false,'noPieces');
 if(!pieces.some(x=>!x.used&&findAny(x)))return levelEnd(g,false,'noSpace');
}
async function levelEnd(g,won,why){
 busy=true;
 if(won){
  const L=LEVELS[lvl],st=lvData().stars;
  const stars=!L.m?3:1+(lvlLeft>=L.m*.25)+(lvlLeft>=L.m*.45);
  st[lvl]=Math.max(st[lvl]||0,stars);persist();
  buzz([40,60,40,60,80]);play('limpa_tudo');celebrate(Math.max(1,triples));
  await wait(reduce?200:1300);if(g!==gen)return;
  $('#lvlEndTitle').textContent=t('lvlWin');
  $('#lvlStars').innerHTML=[0,1,2].map(k=>`<i class="${k<stars?'on':''}" style="animation-delay:${200+k*250}ms">⭐</i>`).join('');
  $('#lvlWhy').textContent=lvl===LEVELS.length-1?t('allDone'):'';
  $('#lvlNext').hidden=lvl===LEVELS.length-1;
 }else{
  msg.textContent=t(why);buzz(200);play('fim');
  const hit=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(grid[y][x])hit.push([y,x,(N-1-y)*45+x*10]);
  await fxRun(hit,'fx-dead',500);await wait(reduce?0:450);if(g!==gen)return;
  $('#lvlEndTitle').textContent=t('lvlFail');$('#lvlStars').innerHTML='';
  $('#lvlWhy').textContent=t(why);$('#lvlNext').hidden=true;
 }
 busy=false;$('#lvlScore').textContent=score;show('lvlEnd');
}

/* ===== PLACAR MUNDIAL (Google Play Games) =====
   Usa o plugin nativo PlacarOnline (android/.../PlacarOnlinePlugin.java).
   No navegador, ou enquanto os IDs do Play Console não forem preenchidos, mostra um aviso. */
const Placar=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.PlacarOnline;
let rankReturn='menu';
async function rankStatus(){try{return Placar?await Placar.status():{available:false}}catch(e){return {available:false}}}
function sendScore(n){if(Placar&&n>0)Placar.submitScore({score:n}).catch(()=>{})} // o placar guarda só o maior de cada jogador
async function openRank(){
 rankReturn=screen;
 const st=await rankStatus();
 if(st.available){try{await Placar.showLeaderboard();sendScore(best);return}catch(e){$('#rankMsg').textContent=t('rankFail')}}
 else $('#rankMsg').textContent=t('rankSoon');
 $('#rankBest').textContent=best;show('rank');
}

let screen='menu',howtoReturn='menu';
const LOGO=['AAB.CCD','A.BBC.D','EEE.FFD']; // desenho de blocos do logo (letra = cor, ponto = vazio)
function drawLogo(){
 const el=$('#logo'),pal={A:colors[0],B:colors[1],C:colors[3],D:colors[4],E:colors[2],F:colors[5]};el.innerHTML='';
 LOGO.forEach((row,y)=>[...row].forEach((ch,x)=>{const i=document.createElement('i');if(ch==='.')i.className='e';else{i.style.setProperty('--c',pal[ch]);i.style.setProperty('--d',(x*60+y*90)+'ms')}el.append(i)}));
}
function show(name){
 if(drag)stopDrag();
 ['menu','pause','over','howto','lang','levels','lvlEnd','rank'].forEach(s=>$('#'+s).classList.toggle('show',s===name));
 screen=name;
 if(name==='menu'||name==='levels')backToClassic();
 if(name==='levels')drawLevels();
 if(name==='menu'){
  $('#menuBest').textContent=best;drawLogo();
  $('#playBtn').textContent=hasGame?t('cont'):t('play');$('#newBtn').hidden=!hasGame;
 }
 if(name==='lang')drawLangs();
 $('#restartBtn').innerHTML=mode==='level'?t('lvlRestart'):t('restart');
 if(name==='over'||name==='pause'||name==='howto'||name==='lang'||name==='levels'||name==='lvlEnd')$('#'+name).scrollTop=0;
}
$('#playBtn').onclick=()=>{
 if(!ready)return;
 if(!hasGame)newGame();
 if(!DATA.seenHelp){DATA.seenHelp=true;persist();howtoReturn='game';show('howto')} // 1ª vez: mostra as regras
 else show('game');
};
$('#newBtn').onclick=()=>{if(!ready)return;newGame();show('game')};
$('#pauseBtn').onclick=()=>show('pause');
$('#resumeBtn').onclick=()=>show('game');
$('#restartBtn').onclick=()=>{if(mode==='level')startLevel(lvl);else{newGame();show('game')}};
$('#pauseMenuBtn').onclick=()=>show('menu');
$('#againBtn').onclick=()=>{newGame();show('game')};
$('#overMenuBtn').onclick=()=>show('menu');
document.querySelectorAll('[data-go=howto]').forEach(b=>b.onclick=()=>{howtoReturn=screen;show('howto')});
$('#howtoBack').onclick=()=>show(howtoReturn);
$('#langBtn').onclick=()=>show('lang');
$('#levelsBtn').onclick=()=>{if(ready)show('levels')};
$('#levelsBack').onclick=()=>show('menu');
document.querySelectorAll('[data-rank]').forEach(b=>b.onclick=()=>{if(ready)openRank()});
$('#rankBack').onclick=()=>show(rankReturn);
$('#lvlNext').onclick=()=>startLevel(Math.min(LEVELS.length-1,lvl+1));
$('#lvlRetry').onclick=()=>startLevel(lvl);
$('#lvlToList').onclick=()=>show('levels');
$('#langBack').onclick=()=>show('menu');
// clique dos botões do menu usa o som de encaixe, mais agudo
document.querySelectorAll('.btn').forEach(b=>b.addEventListener('click',()=>play('encaixar',1.3)));

// app foi para segundo plano no meio da partida: abre a pausa
// e garante que tudo fica gravado antes de o Android poder fechar o app
document.addEventListener('visibilitychange',()=>{if(!document.hidden||!ready)return;if(screen==='game')show('pause');DATA.best=best;persist()});

// botão "voltar" do Android
const CapApp=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
if(CapApp)CapApp.addListener('backButton',()=>{
 if(screen==='game')show('pause');
 else if(screen==='pause')show('game');
 else if(screen==='howto')show(howtoReturn);
 else if(screen==='lang')show('menu');
 else if(screen==='over')show('menu');
 else if(screen==='levels')show('menu');
 else if(screen==='rank')show(rankReturn);
 else if(screen==='lvlEnd')show('levels');
 else CapApp.exitApp();
});

/* início: carrega o save e depois monta o jogo */
drawBoard();
(async()=>{
 await loadData();
 best=bestAtStart=DATA.best;setNum(bestEl,best);
 muted=!DATA.sfx;musicOn=DATA.music;setLang(DATA.lang||detectLang(),false);
 if(loadGame()){hasGame=true;setNum(scoreEl,score);drawBoard();drawTray(false)}
 else makePieces();
 ready=true;show('menu');
 rankStatus().then(st=>{if(st.available)sendScore(best)}); // manda o recorde que já existia
})();
</script>
